<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · Joseph Breitreiter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.baseurl }}/src/site.css">
</head>
<body>
  <div class="page page--case is-ready">
    <main class="column">

      <p class="case-back">
        <a href="{{ site.baseurl }}/" class="t-link">
          <span class="t-link-arrow">← </span><span class="t-link-text">home</span>
        </a>
      </p>

      <header class="case-header">
        <h1 class="case-title">{{ page.title }}</h1>
        {% if page.subtitle %}<p class="case-subtitle">{{ page.subtitle }}</p>{% endif %}
      </header>

      <article class="markdown">
        {{ content }}
      </article>

      <p class="case-back" style="margin-top: 48px;">
        <a href="{{ site.baseurl }}/" class="t-link">
          <span class="t-link-arrow">← </span><span class="t-link-text">home</span>
        </a>
      </p>

    </main>
  </div>

  <!-- Clicky -->
  <script async src="//static.getclicky.com/101388075.js"></script>
  <noscript><p><img alt="Clicky" width="1" height="1" src="//in.getclicky.com/101388075ns.gif" /></p></noscript>
</body>
</html>
